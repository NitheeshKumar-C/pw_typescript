name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      pages_artifact_uploaded: ${{ steps.upload-pages.outcome == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm test:allure
        env:
          CI: true

      - name: Generate Allure HTML report
        if: ${{ !cancelled() && hashFiles('allure-results/**') != '' }}
        run: pnpm allure:generate

      - name: Upload Allure HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Allure raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Playwright test results and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload GitHub Pages artifact
        id: upload-pages
        if: >-
          ${{
            !cancelled() &&
            github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' ||
             github.ref == 'refs/heads/master') &&
            hashFiles('allure-report/**') != ''
          }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

  cleanup-artifacts:
    name: Keep Artifacts From Latest 4 Runs
    needs: test
    if: >-
      ${{
        !cancelled() &&
        github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master')
      }}
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Keep artifacts from latest 4 runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_FILE: playwright.yml
        shell: bash
        run: |
          set -euo pipefail

          recent_runs="$(
            gh run list \
              --repo "$REPO" \
              --workflow "$WORKFLOW_FILE" \
              --branch "$BRANCH" \
              --limit 1000 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].databaseId'
          )"

          all_runs="$(
            printf '%s\n%s\n' "$CURRENT_RUN_ID" "$recent_runs" |
              awk 'NF && !seen[$0]++'
          )"

          printf '%s\n' "$all_runs" |
            tail -n +5 |
            while IFS= read -r old_run_id; do
              [ -n "$old_run_id" ] || continue

              gh api --paginate \
                "repos/$REPO/actions/runs/$old_run_id/artifacts?per_page=100" \
                --jq '.artifacts[].id' |
                while IFS= read -r artifact_id; do
                  [ -n "$artifact_id" ] || continue

                  echo "Deleting artifact $artifact_id from run $old_run_id"

                  gh api --method DELETE \
                    "repos/$REPO/actions/artifacts/$artifact_id"
                done
            done

  deploy-report:
    name: Deploy Allure Report to GitHub Pages
    needs: test
    if: >-
      ${{
        !cancelled() &&
        needs.test.outputs.pages_artifact_uploaded == 'true' &&
        github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master')
      }}
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4