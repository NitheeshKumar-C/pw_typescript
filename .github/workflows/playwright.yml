name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          CI: true

      - name: Upload HTML report for GitHub Pages
        if: >-
          ${{
            always() &&
            !cancelled() &&
            github.event_name != 'pull_request' &&
            (github.ref == 'refs/heads/main' ||
             github.ref == 'refs/heads/master')
          }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

      - name: Upload HTML report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload test results and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 90
          if-no-files-found: ignore

  cleanup-artifacts:
    name: Keep Artifacts From Latest 4 Runs
    needs: test
    if: >-
      ${{
        always() &&
        needs.test.result != 'cancelled' &&
        github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: write
      contents: read

    steps:
      - name: Install GitHub CLI
        run: |
          gh --version

      - name: Remove artifacts from older runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Finding recent runs for '$WORKFLOW_NAME' on '$BRANCH'..."

          recent_runs="$(
            gh run list \
              --repo "$REPO" \
              --workflow "$WORKFLOW_NAME" \
              --branch "$BRANCH" \
              --limit 1000 \
              --json databaseId \
              --jq '.[].databaseId'
          )"

          # Put this run first, then remove duplicate run IDs.
          all_runs="$(
            printf '%s\n%s\n' "$CURRENT_RUN_ID" "$recent_runs" |
              awk 'NF && !seen[$0]++'
          )"

          # Keep the newest four runs, including this run.
          keep_runs="$(printf '%s\n' "$all_runs" | head -n 4)"

          echo "Runs whose artifacts will be retained:"
          printf '%s\n' "$keep_runs"

          # Delete artifacts only from older runs of this workflow
          # on the current branch.
          printf '%s\n' "$all_runs" | tail -n +5 |
          while IFS= read -r old_run_id; do
            [ -n "$old_run_id" ] || continue

            echo "Checking artifacts for old run: $old_run_id"

            artifact_ids="$(
              gh api --paginate \
                "repos/$REPO/actions/runs/$old_run_id/artifacts?per_page=100" \
                --jq '.artifacts[].id'
            )"

            if [ -z "$artifact_ids" ]; then
              echo "No artifacts found for run $old_run_id"
              continue
            fi

            while IFS= read -r artifact_id; do
              [ -n "$artifact_id" ] || continue

              echo "Deleting artifact $artifact_id from run $old_run_id"

              gh api --method DELETE \
                "repos/$REPO/actions/artifacts/$artifact_id"
            done <<< "$artifact_ids"
          done

          echo "Artifact cleanup completed."

  deploy-report:
    name: Deploy HTML Report to GitHub Pages
    needs: test
    if: >-
      ${{
        always() &&
        needs.test.result != 'cancelled' &&
        github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4